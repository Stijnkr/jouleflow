[project]
name = "jouleflow"
version = "0.1.0"
description = "Open-source home energy management system"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "websockets>=13",
    "httpx>=0.28",
    "pydantic-settings>=2.6",
    "cryptography>=42",
    "python-kasa>=0.10.2",
    "pymodbus>=3.8",
]

[project.scripts]
jouleflow = "jouleflow.main:run"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
